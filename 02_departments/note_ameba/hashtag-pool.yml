# note/Ameba ハッシュタグ候補リスト(2026-10-17新設)
#
# tools/note_ameba/select.js が投稿のたびにこのリストから記事に合うタグを選ぶ。
# 選び方: 記事のタイトル・subject・本文に keywords が多く出てくるタグほど優先し、
# 週次インサイト分析(04_analytics/note_ameba/performance.json)で
# 実績の良かったタグにはボーナスを付ける。
#
# 益田さんへ: 自由に追加・削除してOKです。
#   - tag:       実際に付けるタグ(#は不要)
#   - keywords:  記事にこの言葉が出てきたらこのタグを候補にする
#   - platforms: 片方だけで使いたい場合に指定(省略時は両方)
# 特定の記事だけタグを固定したいときは、下書きのfrontmatterに
#   hashtags: [子育て, 大学受験]
# と書けば、その記事はこのリストを使わずそのタグで投稿されます。

limits:
  note: 5    # note公式ヘルプ「タグは5つぐらいが効果的」
  ameba: 5

# 毎回必ず付けるタグ(上限数にカウントされる)
always:
  - 学ジム

tags:
  - tag: 子育て
    keywords: [子育て, 子ども, 子供, お子さん, お子様, 親子]
  - tag: 声かけ
    keywords: [声かけ, 声掛け, 言葉がけ, フレーズ, NG例, OK例]
  - tag: 保護者
    keywords: [保護者様, 保護者, 親として, 家庭]
  - tag: 大学受験
    keywords: [大学受験, 受験生, 志望校, 入試, 共通テスト, 受験]
  - tag: 総合型選抜
    keywords: [総合型選抜, 総合型, AO入試, 志望理由, 面接, 小論文, 学部研究]
  - tag: 学校推薦型選抜
    keywords: [推薦, 学校推薦型, 指定校]
  - tag: 勉強法
    keywords: [勉強法, 学習法, 覚え方, 復習, 勉強の仕方, 暗記]
  - tag: 暗記
    keywords: [暗記, 覚えられない, 記憶, 忘却曲線, 単語帳]
  - tag: やる気
    keywords: [やる気, モチベーション, 自己肯定感, 意欲, 投げ出す]
  - tag: 勉強習慣
