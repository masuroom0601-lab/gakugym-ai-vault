name: instagram-tiktok-daily-draft

on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch: {}

env:
  TZ: Asia/Tokyo   # 日本時間で日付を扱うため(UTCのままだとJST朝のcronで日付が1日ずれる不具合があった)

permissions:
  contents: write
  id-token: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate Instagram/TikTok draft
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true
          claude_args: |
            --allowedTools "Write,Bash(git *)"
          prompt: |
            あなたは「学ジム」のInstagram/TikTok担当AIです。
            以下のファイルを読み、そこに書かれたルールに厳密に従ってください:
            - 02_departments/instagram_tiktok/department.md
            - 03_assets/brand-guide.md
            - 01_HQ/calendar.md(あれば、今月のテーマを確認)
            - 00_INBOX/ 内のネタ(あれば参考にする)
            - 02_departments/analytics/learned-patterns.md(2026-10-17追加。過去の
              エンゲージメントデータや益田さんのフィードバックから分かっている
              「伸びる型・避けるべき型」の知見。department.mdの確定ルールと矛盾する
              場合はdepartment.mdを優先する。エンゲージメントデータに基づく知見が
              まだ無い場合はその旨が明記されているので、その場合は通常通り作成してよい)

            本日の日付を確認し、リール1本分(台本+表紙のテーマ文言+投稿時に
            そのまま使うキャプション)とフィード1本分の下書きを、department.md の
            フォーマットに厳密に従って作成してください。キャプションは
            department.md の「キャプション」節のルールに必ず従うこと
            (これまで生成し忘れていた項目なので、絶対に省略しないこと)。
            (2026-10-11更新: リールのサムネイル画像は廃止したため、サムネ案は
            作成不要。代わりに表紙のテーマ文言(短い一言)を明記すること)

            特に以下の7点は必ず守ってください(department.mdの「科目別コンテンツの
            対象科目」「テーマ選定ルール」「リール」「フィード(カルーセル)」節に
            詳細あり):
            1. 科目に紐づく内容を扱う場合、対象科目は現代文・古文(漢文は含まない)・
               英語・日本史・総合型選抜の5科目のみとすること。それ以外の科目
               (数学・理科・地理・公民・漢文など)は扱わない。スマホ依存対策・
               暗記術・ノートの取り方などの科目非依存コンテンツはこの制限の対象外
               で、これまで通り自由に扱ってよい。
            2. リールとフィードは必ず異なるテーマ・切り口にすること(同じ内容の
               使い回しにしない)。
            3. (2026-10-11更新、重要)リールは必ず**10項目**作成し、タイトルは
               常に「〇〇10選」のように「10選」で統一すること。そのうち**前半5項目
               (Canva本編用)**は、各項目を「メイン文」(番号込み、例:「1. 〜」)と
               「補足文」(メインを補強する一言)のセットで作成すること。**後半5項目
               (6〜10番目)はCanva本編には使わず、キャプション本文側で列挙する**
               (動画内には「残り5つはキャプションをみてね」という誘導文がテンプレート
               側に組み込み済みのため、台本側で重複して書く必要はない)。作成後、
               前半5項目・後半5項目・合計10項目になっているか必ず数え直して確認する
               こと(旧ルールだった「タイトルの数字と本編項目数を完全一致させる」
               「残りはキャプションcheckのような文言を使わない」は、この新テンプレート
               の仕様により廃止・置き換え済み)。
            4. リール表紙のテーマ文言は、department.mdの「表紙のテーマ配色ルール」
               (総合型選抜=紫/英語=黄色/古文=ピンク/現代文=赤/日本史=緑/
               科目非依存=青)に対応するテーマである前提で選ぶこと。ただし2026-10-11
               時点では色の適用は自動化されておらず益田さんが手動で行うため、下書きには
               文言本体(例:「古文」「スマホ依存対策」)のみ明記すればよい(色指定は不要)。
            5. フィードのテンプレートは常に「通常版」を使うこと(2026-09-27に
               「図解で覚えるシリーズ」は廃止した)。フィード下書きセクションの
               冒頭に「使用テンプレート: 通常版」と明記すること。締めのまとめ
               項目数は中面の項目数と必ず一致させ、作成後に数え直して確認する
               こと(項目数を勝手に減らさない)。
            6. (2026-10-18追加、重要)フィードにも専用のキャプションを必ず作成すること。
               department.md の「フィードキャプション」節のルールに従い、
               「## フィード下書き(カルーセル)」節の直後に
               「## フィードキャプション(投稿時にそのままコピペする本文)」節を置く。
               リール用キャプションの流用は不可(リールとフィードはテーマが別のため)。
            7. (2026-10-18追加)リール・フィードとも、キャプションのハッシュタグに
               **`#学ジム` を付けないこと**(知名度がまだ低く検索されないため)。
               5個の枠はすべてテーマ・科目・対象のタグに使う。

            作成したファイルは
            02_departments/instagram_tiktok/drafts/task-<今日の日付YYYY-MM-DD>-ig-001.md
            という名前で保存してください(frontmatter込み)。

            最後に、以下のコマンドで変更をコミット・プッシュしてください:
            git config user.name "gakugym-ai-bot"
            git config user.email "bot@example.com"
            git add 02_departments/instagram_tiktok/drafts/
            git commit -m "instagram/tiktok daily draft $(date +%F)"
            git push
