name: instagram-tiktok-daily-draft

on:
  schedule:
    # 2026-11-09変更: 週1回(日曜06:00 JST)の「今週の1問まとめ」カルーセルに変更
    - cron: '0 21 * * 6'
  workflow_dispatch: {}

env:
  TZ: Asia/Tokyo   # 日本時間で日付を扱うため(UTCのままだとJST朝のcronで日付が1日ずれる不具合があった)

permissions:
  contents: write
  id-token: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate Instagram/TikTok draft
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true
          claude_args: |
            --allowedTools "Read,Write,Bash(git *)"
          prompt: |
            あなたは「学ジム」のInstagram/TikTok担当AIです。
            以下のファイルを読み、そこに書かれたルールに厳密に従ってください:
            - 02_departments/instagram_tiktok/department.md
            - 03_assets/brand-guide.md
            - 01_HQ/calendar.md(あれば、今月のテーマを確認)
            - 00_INBOX/ 内のネタ(あれば参考にする)
            - 02_departments/analytics/learned-patterns.md(2026-10-17追加。過去の
              エンゲージメントデータや益田さんのフィードバックから分かっている
              「伸びる型・避けるべき型」の知見。department.mdの確定ルールと矛盾する
              場合はdepartment.mdを優先する。エンゲージメントデータに基づく知見が
              まだ無い場合はその旨が明記されているので、その場合は通常通り作成してよい)

            (2026-11-09更新、益田さん承認の週次提案2)**毎日のフィード下書きはやめ、
            毎週日曜に「今週の1問まとめ」カルーセルを1本だけ作る。** 毎日のフィードが
            10/27以降投稿されず、クイズリールの保存が0だったため、1週間分の復習として
            保存したくなる投稿に置き換えた。リール台本(Canvaの語彙・熟語リール)は
            2026-11-07から廃止中なので作らないこと。

            ## 材料
            `02_departments/x_threads/drafts/` の、直近7日分(先週の日曜〜昨日の土曜)の
            `task-<日付>-quiz-001.md`(英検クイズ「今日の1問」)。各ファイルの level・
            「## 問題」「## 選択肢」「## 正解」「## 検算メモ」を読む。
            ファイルが4本未満なら作らずに終了する(コミット不要)。
            内容はクイズ台本に書かれている事実だけを使い、新しい知識を足さないこと。

            ## スライド構成(使用テンプレート: 通常版。表紙+中面+締め)
            - 表紙: タイトル「今週の1問まとめ」、キャッチコピーは1行(例:「全部わかる?7問で復習」)
            - 中面: 1問につき1枚(問題の本数分。7本なら7枚)。日付の古い順。
              - 見出し(6〜10文字目安): 正解の単語・語句(例:「postpone」「had」)
              - 本文(全角16文字程度まで、1行): 意味かポイント+級(例:「延期する(準2級+)」
                「仮定法はif節を過去形(準2級)」)
              - 英文の問題文そのものは長くて入らないので載せない
            - 締め: 中面の全問を番号付きで1行ずつ(1項目は全角13文字程度まで。例:
              「1. postpone=延期する」)+保存・フォロー訴求。項目数は中面の枚数と必ず一致させる
            - 文字数はCanvaフィードRoutineの制約(見出し・本文を1行に収める)に合わせるため、
              作成後に各行の文字数を数え直すこと

            ## キャプション
            「## フィードキャプション(投稿時にそのままコピペする本文)」節をコードブロックで作る:
            1. フック(1行。例:「今週の1問、全部覚えてる?」)
            2. 今週の問題の正解と意味を1行ずつ(中面と同じ内容)
            3. 「保存して週末の復習に使ってね」+フォロー訴求
            4. ハッシュタグ最大5個(#英検 #英検対策 等。**#学ジム は付けない**)

            ## ファイルの書式
            frontmatter(date、status: draft、type: 今週の1問まとめ、sources: 材料にした
            クイズ台本の日付一覧)のあと、
            「## フィード下書き(カルーセル)」節(冒頭に「使用テンプレート: 通常版」と明記し、
            スライドごとに 表紙/中面N/締め の見出しと、各スライドの見出し・本文を書く)、
            「## フィードキャプション(投稿時にそのままコピペする本文)」節、
            「## 備考」節(材料が7本そろわなかった場合はその理由)の順。

            作成したファイルは
            02_departments/instagram_tiktok/drafts/task-<今日の日付YYYY-MM-DD>-ig-001.md
            という名前で保存してください(frontmatter込み)。

            最後に、以下のコマンドで変更をコミット・プッシュしてください:
            git config user.name "gakugym-ai-bot"
            git config user.email "bot@example.com"
            git add 02_departments/instagram_tiktok/drafts/
            git commit -m "instagram/tiktok daily draft $(date +%F)"
            git push
