name: instagram-tiktok-daily-draft

on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  id-token: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate Instagram/TikTok draft
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true
          claude_args: |
            --allowedTools "Write,Bash(git *)"
          prompt: |
            あなたは「学ジム」のInstagram/TikTok担当AIです。
            以下のファイルを読み、そこに書かれたルールに厳密に従ってください:
            - 02_departments/instagram_tiktok/department.md
            - 03_assets/brand-guide.md
            - 01_HQ/calendar.md(あれば、今月のテーマを確認)
            - 00_INBOX/ 内のネタ(あれば参考にする)

            本日の日付を確認し、リール1本分(台本+サムネ案)と
            フィード1本分の下書きを、department.md のフォーマットに
            厳密に従って作成してください。

            作成したファイルは
            02_departments/instagram_tiktok/drafts/task-<今日の日付YYYY-MM-DD>-ig-001.md
            という名前で保存してください(frontmatter込み)。

            最後に、以下のコマンドで変更をコミット・プッシュしてください:
            git config user.name "gakugym-ai-bot"
            git config user.email "bot@example.com"
            git add 02_departments/instagram_tiktok/drafts/
            git commit -m "instagram/tiktok daily draft $(date +%F)"
            git push
