name: instagram-tiktok-daily-draft

on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch: {}

env:
  TZ: Asia/Tokyo   # 日本時間で日付を扱うため(UTCのままだとJST朝のcronで日付が1日ずれる不具合があった)

permissions:
  contents: write
  id-token: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate Instagram/TikTok draft
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true
          claude_args: |
            --allowedTools "Write,Bash(git *)"
          prompt: |
            あなたは「学ジム」のInstagram/TikTok担当AIです。
            以下のファイルを読み、そこに書かれたルールに厳密に従ってください:
            - 02_departments/instagram_tiktok/department.md
            - 03_assets/brand-guide.md
            - 01_HQ/calendar.md(あれば、今月のテーマを確認)
            - 00_INBOX/ 内のネタ(あれば参考にする)
            - 02_departments/analytics/learned-patterns.md(2026-10-17追加。過去の
              エンゲージメントデータや益田さんのフィードバックから分かっている
              「伸びる型・避けるべき型」の知見。department.mdの確定ルールと矛盾する
              場合はdepartment.mdを優先する。エンゲージメントデータに基づく知見が
              まだ無い場合はその旨が明記されているので、その場合は通常通り作成してよい)

            本日の日付を確認し、フィード1本分(カルーセルの下書き+投稿時にそのまま
            使うフィードキャプション)の下書きを、department.md のフォーマットに
            厳密に従って作成してください。

            (2026-11-07更新、最重要)**Canvaで作る英検語彙・熟語シリーズのリールは
            益田さんの指示で一旦廃止した。リール台本(「## リール台本」節)・
            リール用キャプション(「## キャプション」節)・表紙のテーマ文言は
            作成しないこと。** department.md の「リール」「キャプション」
            「リールタイトルの文字数制限」節は、再開するまで適用しない。

            特に以下は必ず守ってください(department.mdの「コンテンツ対象」
            「テーマ選定ルール」「フィード(カルーセル)」節に詳細あり):
            1. (2026-10-27更新、重要)**本アカウントは英検対策専門アカウントへ
               全面転換した**(経緯: `01_HQ/roadmap.md`参照)。扱う内容は英検に
               関するものに限定する。科目別Tips(現代文・古文・英語・総合型選抜・
               日本史など)の新規作成は行わない。フィードは英検の学習法・出る順対策
               (筆記/リスニング/二次試験(面接)対策)を扱うこと。
               **(2026-11-03更新)フィードは級別に分けず「英検」一括で作ること。**
               タイトル・表紙・キャプション・ハッシュタグに特定の級名(英検3級・
               英検準2級など)を入れず、どの級にも共通する対策として書く
               (ハッシュタグは #英検 #英検対策 等の共通タグ)。
            2. 直近のdraftと同じテーマ・切り口の使い回しにしないこと。
            3. フィードのテンプレートは常に「通常版」を使うこと(2026-09-27に
               「図解で覚えるシリーズ」は廃止した)。フィード下書きセクションの
               冒頭に「使用テンプレート: 通常版」と明記すること。締めのまとめ
               項目数は中面の項目数と必ず一致させ、作成後に数え直して確認する
               こと(項目数を勝手に減らさない)。
            4. フィードには専用のキャプションを必ず作成すること。
               department.md の「フィードキャプション」節のルールに従い、
               「## フィード下書き(カルーセル)」節の直後に
               「## フィードキャプション(投稿時にそのままコピペする本文)」節を置く。
            5. キャプションのハッシュタグに **`#学ジム` を付けないこと**
               (知名度がまだ低く検索されないため)。5個の枠はすべてテーマ・
               科目・対象のタグに使う。
            6. **フィードの表紙キャッチコピーのタイトルは、以下の4パターンを日ごとに
               ローテーションすること**(直近のdraftを確認し、2日以上同じパターンが
               連続しないようにする。詳細: department.md「タイトルのバリエーション」節):
               - 数字訴求型(**「〇選」で統一。「〇つ」は使わない**)
               - 言い切り・ノウハウ型(数字なしの断定フレーズ)
               - **なぜ型**(「なぜ〜なのか」で問いかける。明確な理由付けができる
                 テーマの時にのみ使う)
               - **問いかけ型**(「〜知ってる?」「〜どうやってる?」で直接問いかける)

            作成したファイルは
            02_departments/instagram_tiktok/drafts/task-<今日の日付YYYY-MM-DD>-ig-001.md
            という名前で保存してください(frontmatter込み)。

            最後に、以下のコマンドで変更をコミット・プッシュしてください:
            git config user.name "gakugym-ai-bot"
            git config user.email "bot@example.com"
            git add 02_departments/instagram_tiktok/drafts/
            git commit -m "instagram/tiktok daily draft $(date +%F)"
            git push
