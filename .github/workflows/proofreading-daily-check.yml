name: proofreading-daily-check

on:
  schedule:
    - cron: '10 21 * * *'   # 毎日 06:10 JST(下書き生成の直後、秘書担当・統括担当の前)
  # 2026-11-03追加: ③(sumaho_habit)の下書きは生成に時間がかかり06:10に間に合わないことが
  # あるため、下書き生成ワークフローの完了直後にも走らせる
  workflow_run:
    workflows: ["sumaho-habit-daily-draft"]
    types: [completed]
  workflow_dispatch: {}

concurrency:
  group: proofreading-daily-check
  cancel-in-progress: false

env:
  TZ: Asia/Tokyo   # 日本時間で日付を扱うため(UTCのままだとJST朝のcronで日付が1日ずれる不具合があった)

permissions:
  contents: write
  id-token: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Install tools for question line check
        # 2026-11-13追加: 英検クイズの問題文が動画で何行になるかを、動画と同じ書体で数えるため
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-ipafont-gothic
          python3 -m pip install -q pillow

      - name: Proofread pending drafts
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true
          claude_args: |
            --allowedTools "Read,Edit,Bash(git *),Bash(python3 02_departments/creative/reel_quiz/check_question_lines.py *)"
          prompt: |
            あなたは「学ジム」の校正担当AIです。
            02_departments/proofreading/department.md に書かれたルールに厳密に従い、
            以下の日次業務を実行してください。

            ## 対象範囲
            以下5部署の drafts/ フォルダ内で、frontmatterの status が
            "draft" になっているファイルすべてを対象とする
            (review/todo/published等、他のstatusのファイルは対象外):
            - 02_departments/instagram_tiktok/drafts/
            - 02_departments/x_threads/drafts/
            - 02_departments/note_ameba/drafts/
            - 02_departments/line/drafts/
            - 02_departments/sumaho_habit/drafts/(2026-11-03追加。ただしファイル名の
              日付が今日(JST)から2日前以降のものだけ。それより古い③の下書きは投稿済みの
              ため対象外)

            対象ファイルが1件もない場合は、何もせず終了してよい(コミットも不要)。

            ## チェック項目(department.md準拠)
            1. 03_assets/brand-guide.md の「5. NGルール」(偏差値・合格実績の誇大表現、
               他塾名指し批判、個人情報の無断使用)に抵触していないか
            2. 誤字脱字、数字の整合性(例:リールのリスト数とサムネの数字が一致しているか)
            3. 媒体ごとのトーン・一人称(「私」)・呼びかけ(生徒向けは「きみ」/
               保護者向けは「保護者様」)がbrand-guide.mdおよび各department.mdの
               フォーマット通りか
            4. (該当ファイルがあれば)クリエイティブ担当が生成した画像/動画の
               文字化けチェック指示が明記されているか
            5. 【sumaho_habit(③massu_smartphone)のみ】02_departments/sumaho_habit/department.md
               のルールに沿っているか。特に:
               - 学ジムのロゴ・サービス名・送客(LINE誘導等)が入っていない(③は送客しない)。
                 キャプションに #学ジム が無く、ハッシュタグは5個以内
               - 科目知識の勉強法Tipsではなく、スマホ対策・習慣化(dopamine版はゲーム・動画・
                 集中力まで可)の内容になっている
               - checkup形式: チェック項目が4〜8個、「**タイトル**:」「**チェック項目**:」
                 「**診断ライン**:」の書式が崩れていない(動画生成が機械的に読むため)。
                 frontmatterに checkup_variant があり、dopamine版なら診断ラインが
                 「N個以上当てはまったあなたは"ドーパミン中毒"かも」の形で、「中毒」を
                 病気の診断のように断定したり不安を煽りすぎたりしていない
               - canva_7rules形式: 項目が①〜⑦のちょうど7個
               - 直近30日の③の台本とタイトルが重複していない(title_checked_against の記載)
               - キャプションの改善法がチェック項目・7項目と対応している
            6. 【x_threads(英検クイズ「今日の1問」)のみ、2026-11-09追加】
               - 正解・問題の重複: 02_departments/x_threads/drafts/ の過去60日分の
                 task-*-quiz-001.md を自分でも読み、今回の「## 正解」の単語(活用形の違いは
                 同じ単語とみなす)または「## 問題」の英文が重複していないか確認する。
                 重複していれば「要修正」とし、重複した日付と単語を明記する
               - キャプションの冒頭(フック文・コメント誘導)に正解の文字や単語が
                 書かれていないか。正解・解説は「▼正解と解説」の下にあるか
               - (2026-11-13追加、益田さん承認)問題文の行数: 次のコマンドで動画上の行数を
                 数える(目分量で判断しない): python3 02_departments/creative/reel_quiz/check_question_lines.py <台本のパス>
                 3行以上(「NG」と出る)なら「要修正」とし、行数と、短くする案(削れる部分)を書く
            7. 【x_threads の「爆速英単語」台本(task-*-vocab-001.md)のみ、2026-11-14追加】
               - 「## 単語リスト」の表がちょうど40行で、「| 番号 | 英単語 | 意味 |」の書式が崩れていないか
                 (動画はこの表から機械的に作るため)
               - **40語すべての意味が正しいか(最重要)**。1語ずつ、その英単語の代表的な意味
                 (辞書の第一義)として正しいか、品詞が合っているか、綴りに誤りが無いかを確認する。
                 誤りが1つでもあれば「要修正」とし、該当の番号・単語と正しい意味を書く
               - 意味が全角10文字以内、英単語が14文字以内か。40語の中に重複が無いか
               - level の級に合った難しさか(3級に準1級の語が混ざっていない等)
               - 過去60日分の同じ級の task-*-vocab-001.md と単語が重複していないか
               - キャプションの「▼今回の40語」が表と同じ内容・同じ順番か。ハッシュタグ5個以内・#学ジム なし
               - 問題がなければ status を review にする(動画はこの合格のあとに作られる)

            ## 判定と更新方法(ファイルの移動は行わず、frontmatterのみ変更する)
            - 問題がない場合:
              - frontmatterの `status: draft` を `status: review` に変更する
              - ファイル末尾に `## 校正担当コメント` セクションを追加し、
                「問題なし。承認待ちです。」等、確認済みである旨を1行で記載する
            - 修正が必要な場合:
              - frontmatterの `status` は `draft` のままにする(todoへの差し戻しは
                「担当部署が直す必要がある」という意味なので、statusは変更せず
                `status: draft` を維持し、次回の担当部署AIの実行時に修正されることを期待する)
              - ファイル末尾に `## 校正担当コメント` セクションを追加し、
                具体的にどこがどう問題か(該当箇所を引用しつつ)を明記する

            ## 制約
            - 本文の内容そのものを校正担当が書き換えることはしない
              (指摘のみ行い、修正は各部署の担当AIに委ねる)
            - frontmatterのキー構成(既存のキー)は壊さないこと

            ## 完了後の処理
            チェックしたファイルが1件以上あった場合のみ、以下のコマンドで
            コミット・プッシュしてください:
            git config user.name "gakugym-ai-bot"
            git config user.email "bot@example.com"
            git add 02_departments/*/drafts/
            git commit -m "proofreading check $(date +%F)"
            git pull --rebase origin main
            git push origin HEAD:main
