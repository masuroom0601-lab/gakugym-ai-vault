name: eiken-quiz-reel

# 台本(x-threads-daily-draftが作る task-<日付>-quiz-001.md)から
# 「今日の1問」リール動画(1080x1920・16秒。2026-10-22、フォロー/いいね/保存を
# 促すCTAシーンを追加して13秒から16秒になった)を自動生成してmainにコミットする。
# 旧Canva画像Routineの代替(2026-10-12)。claude.aiのRoutine側のCanva版は停止すること。
#
# 【2026-10-13更新、重要】x-threads-daily-draft(本来06:00 JST)はGitHub Actions側の
# 混雑により実際には09:00〜11:30 JST頃まで毎日ずれ込むことが2026-10-7〜13の
# 1週間の実行ログで判明した。固定時刻(06:45 JST)のスケジュールだけでは台本の
# 完成前に実行されて毎回スキップしてしまうため、x-threads-daily-draftの完了を
# 直接トリガーにする workflow_run を追加した。これにより台本生成が何時にずれても、
# その直後に確実に追従する。固定スケジュールは「台本生成が早く終わった日」向けの
# フォールバックとして残す(どちらが先に走っても、既に生成済みなら後続はスキップする)。

on:
  schedule:
    - cron: '45 21 * * *'   # 毎日 06:45 JST(フォールバック。台本生成が早く終わった日用)
  workflow_run:
    workflows: ["x-threads-daily-draft"]
    types: [completed]
  workflow_dispatch:
    inputs:
      date:
        description: '対象日(YYYY-MM-DD)。空なら今日(JST)'
        required: false

env:
  TZ: Asia/Tokyo

permissions:
  contents: write

concurrency:
  group: eiken-quiz-reel
  cancel-in-progress: false

jobs:
  reel:
    # workflow_run経由の場合、台本生成そのものが失敗した回では動かさない
    # (失敗していなければ台本ファイルが存在するはずで、後続のDecide target draft
    # ステップが実際の有無を再確認する)
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Decide target draft
        id: target
        run: |
          D="${{ github.event.inputs.date }}"
          [ -z "$D" ] && D=$(date +%F)
          DRAFT="02_departments/x_threads/drafts/task-${D}-quiz-001.md"
          OUT="02_departments/creative/reel_quiz/daily/reel-${D}.mp4"
          echo "date=$D" >> "$GITHUB_OUTPUT"
          echo "draft=$DRAFT" >> "$GITHUB_OUTPUT"
          echo "out=$OUT" >> "$GITHUB_OUTPUT"
          if [ ! -f "$DRAFT" ]; then
            echo "台本が無いためスキップ: $DRAFT"; echo "skip=true" >> "$GITHUB_OUTPUT"
          elif grep -q "reel-${D}.mp4" "$DRAFT" && [ -f "$OUT" ]; then
            echo "生成済みのためスキップ"; echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.target.outputs.skip != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-ipafont-gothic
          python3 -m pip install -q pillow

      - name: Generate reel
        if: steps.target.outputs.skip != 'true'
        run: |
          python3 02_departments/creative/reel_quiz/make_reel_from_draft.py \
            "${{ steps.target.outputs.draft }}" "${{ steps.target.outputs.out }}"

      - name: Sanity check video
        if: steps.target.outputs.skip != 'true'
        run: |
          OUT="${{ steps.target.outputs.out }}"
          DUR=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$OUT")
          SIZE=$(stat -c %s "$OUT")
          AUD=$(ffprobe -v error -select_streams a -show_entries stream=codec_type -of csv=p=0 "$OUT")
          echo "duration=$DUR size=$SIZE audio=$AUD"
          [ "$AUD" = "audio" ] || { echo "カウントダウン効果音が入っていません"; exit 1; }
          python3 -c "import sys; d=float('$DUR'); s=int('$SIZE'); sys.exit(0 if 12.5<=d<=13.5 and s>100000 else 1)"

      - name: Record path in draft
        if: steps.target.outputs.skip != 'true'
        run: |
          python3 - <<'PY'
          # 2026-10-17更新: 台本側の見出しが「## Canvaデザイン」(実態と不一致、
          # Canvaは2026-10-12以降不使用)から「## リール動画」に変わったため、
          # 新旧両方の見出しを探す(旧見出しの台本が残っていても動くように)。
          import re
          p = "${{ steps.target.outputs.draft }}"
          line = "- リール動画: ${{ steps.target.outputs.out }}"
          t = open(p, encoding="utf-8").read()
          if line not in t:
              if "## リール動画" in t:
                  t = t.rstrip("\n") + "\n" + line + "\n"
              elif "## Canvaデザイン" in t:
                  t = t.rstrip("\n") + "\n" + line + "\n"
              else:
                  t = t.rstrip("\n") + "\n\n## リール動画\n" + line + "\n"
              open(p, "w", encoding="utf-8").write(t)
          PY

      - name: Commit and push
        if: steps.target.outputs.skip != 'true'
        run: |
          git config user.name "gakugym-ai-bot"
          git config user.email "bot@example.com"
          git add 02_departments/x_threads/drafts/ 02_departments/creative/reel_quiz/daily/
          git commit -m "eiken quiz reel generation ${{ steps.target.outputs.date }}"
          git pull --rebase origin main
          git push origin main
