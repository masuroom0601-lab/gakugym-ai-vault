name: note-ameba-weekly-draft

on:
  schedule:
    - cron: '0 21 * * 0'   # 毎週月曜 06:00 JST
  workflow_dispatch: {}

env:
  TZ: Asia/Tokyo   # 日本時間で日付を扱うため(UTCのままだとJST朝のcronで日付が1日ずれる不具合があった)

permissions:
  contents: write
  id-token: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate note/Ameba draft
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true
          claude_args: |
            --allowedTools "Read,Write,Bash(git *)"
          prompt: |
            あなたは「学ジム」のnote/Amebaブログ担当AIです。
            以下のファイルを読み、そこに書かれたルールに厳密に従ってください:
            - 02_departments/note_ameba/department.md
            - 03_assets/brand-guide.md
            - 02_departments/note_ameba/insights.md
              (週次インサイト分析から得た改善指示。「次回記事への改善指示(最新)」を
              必ず反映すること。department.md/brand-guide.mdと矛盾する場合はそちらを優先)

            保護者向けの学習・子育ての悩みに寄り添う長文記事を、
            department.md の構成(導入→理論的背景→実践ステップ→
            フレーズ変換集→まとめ)に厳密に従って1本作成してください。
            noteとAmebaで同一原稿として使えるものにしてください。

            frontmatterには既存の項目(department, role, date, status: review, platform,
            subject, theme_source, approved_by)に加えて、以下を必ず入れてください
            (この後 tools/note_ameba/suggest.js が、益田さんの手動投稿用にハッシュタグ・見出し画像を選ぶ材料になります):
            - hashtag_candidates: この記事に合うハッシュタグ候補を3〜5個(#は付けない。
              02_departments/note_ameba/hashtag-pool.yml にある言葉を優先し、無ければ新しく提案してよい)
            - image_keywords: 見出し画像の背景写真を選ぶためのキーワードを2〜4個
              (例: [声かけ, 親子, 宿題])
            ※ hashtags: / header_image: / suggested_*: はあなたは書かないこと(suggest.js と人が書く項目)

            作成したファイルは
            02_departments/note_ameba/drafts/task-<今日の日付YYYY-MM-DD>-note-001.md
            という名前で保存してください(frontmatter込み)。

            最後に、以下のコマンドで変更をコミット・プッシュしてください:
            git config user.name "gakugym-ai-bot"
            git config user.email "bot@example.com"
            git add 02_departments/note_ameba/drafts/
            git commit -m "note/ameba weekly draft $(date +%F)"
            git push

      # 2026-10-18追加: 下書きに「おすすめのハッシュタグ・見出し画像」を添付する(手動投稿で使う)
      # (tools/note_ameba/suggest.js。記事内容・週次インサイト分析の実績から選ぶ決定的処理)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Attach suggested hashtags and header image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "gakugym-ai-bot"
          git config user.email "bot@example.com"
          # claude-code-actionは終了時に自分のトークンを無効化するため、このワークフローのGITHUB_TOKENで取得・pushする
          git config --local --unset-all http.https://github.com/.extraheader || true
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git pull --rebase origin main
          cd tools/note_ameba
          npm ci
          npx playwright install --with-deps chromium
          node suggest.js
          cd ../..
          git add 02_departments/note_ameba/drafts/ 02_departments/note_ameba/images/
          if ! git diff --cached --quiet; then
            git commit -m "note/ameba: attach suggested hashtags and header image $(date +%F)"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "No changes to commit."
          fi
