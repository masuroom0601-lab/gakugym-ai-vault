name: note-ameba-probe

# note/Amebaの画面構成の診断(手動実行のみ、2026-10-17新設)。投稿・保存は一切しない。
# ログインして投稿画面の入力欄・ボタン、統計APIの応答構造をログに出す。
# 自動投稿・インサイト収集がサイト側のUI変更で失敗したときの調査用。

on:
  workflow_dispatch:
    inputs:
      rehearsal_draft:
        description: '投稿リハーサルする下書きのファイル名(例: task-2026-10-05-note-001.md)。空なら画面構成の確認のみ。最後の「投稿する」は押さない'
        required: false
        default: ''


permissions:
  contents: read

concurrency:
  group: note-ameba-auto-publish
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: tools/note_ameba
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: tools/note_ameba
        run: npx playwright install --with-deps chromium

      - name: Probe note/Ameba page structure (no posting)
        working-directory: tools/note_ameba
        env:
          NOTE_EMAIL: ${{ secrets.NOTE_EMAIL }}
          NOTE_PASSWORD: ${{ secrets.NOTE_PASSWORD }}
          AMEBA_ID: ${{ secrets.AMEBA_ID }}
          AMEBA_PASSWORD: ${{ secrets.AMEBA_PASSWORD }}
          AMEBA_BLOG_ID: ${{ secrets.AMEBA_BLOG_ID }}
          NOTE_SESSION: ${{ secrets.NOTE_SESSION }}
          AMEBA_SESSION: ${{ secrets.AMEBA_SESSION }}
        run: node probe.js

      - name: Publish rehearsal (stops before the final publish button)
        if: inputs.rehearsal_draft != ''
        working-directory: tools/note_ameba
        env:
          REHEARSAL_DRAFT: ${{ inputs.rehearsal_draft }}
          AMEBA_BLOG_ID: ${{ secrets.AMEBA_BLOG_ID }}
          NOTE_SESSION: ${{ secrets.NOTE_SESSION }}
          AMEBA_SESSION: ${{ secrets.AMEBA_SESSION }}
        run: |
          if ! [[ "$REHEARSAL_DRAFT" =~ ^task-[0-9]{4}-[0-9]{2}-[0-9]{2}-note-[0-9]{3}\.md$ ]]; then
            echo "不正なファイル名です: $REHEARSAL_DRAFT"; exit 1
          fi
          PUBLISH_REHEARSAL="$REHEARSAL_DRAFT" node publish.js

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: note-ameba-probe-screenshots
          path: tools/note_ameba/failure-screenshots/
          if-no-files-found: ignore
          retention-days: 7
