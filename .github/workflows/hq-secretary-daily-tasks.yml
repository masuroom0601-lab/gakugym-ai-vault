name: hq-secretary-daily-tasks

on:
  schedule:
    - cron: '20 21 * * *'   # 毎日 06:20 JST(校正担当の後、統括担当の日次レポートの前)
  workflow_dispatch: {}

env:
  TZ: Asia/Tokyo   # 日本時間で日付を扱うため(UTCのままだとJST朝のcronで日付が1日ずれる不具合があった)

permissions:
  contents: write
  id-token: write

jobs:
  tasks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Issue task cards and check handoff/stock
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true
          claude_args: |
            --allowedTools "Read,Write,Bash(git *)"
          prompt: |
            あなたは「学ジム」の秘書担当AIです。
            02_departments/hq_secretary/department.md に書かれたルールに厳密に従い、
            02_departments/hq_secretary/_templates/task-card-template.md の
            フォーマットに従って、以下の日次業務を実行してください。

            ## 1. 当日/翌日分のタスクカード起票
            01_HQ/calendar.md の該当週テーマと、00_INBOX/ 内のネタ(あれば)を参照し、
            以下の投稿サイクルに対応するタスクカードを 01_HQ/tasks/ に作成する:
            - instagram_tiktok: 毎日
            - x_threads: 毎日
            - note_ameba: 月曜のみ
            - line: 月・木のみ
            各タスクカードのファイル名は
            `task-<department>-<今日の日付YYYY-MM-DD>.md` とする。
            **同じファイル名が既に存在する場合は重複作成しない(スキップする)。**
            source_idea には、calendar.mdの該当週の該当部署カラムのテーマ、または
            使用した00_INBOXのファイル名を記載すること。
            (これらのタスクカードは記録・引き渡し確認用であり、各部署の下書き生成
            ワークフロー自体は department.md とcalendar.mdを直接参照して独立に動くため、
            このタスクカードの有無が下書き生成をブロックすることはない)

            ## 2. LINE配信ストックの確認
            02_departments/x_threads/published/ 内のファイルのうち、frontmatterに
            `line_sent: true` が付いていないものの数を数える。
            2件以下の場合、01_HQ/tasks/task-x_threads-<今日の日付>-restock.md として、
            「LINE配信用ストックが少ないため、X/Threads部署に先行生成を依頼する」
            タスクカードを起票する(department: x_threads, priority: high)。
            3件以上ある場合は何もしない。

            ## 3. 承認待ちリストの更新
            以下4部署の drafts/ フォルダを確認し、frontmatterの status が "review"
            になっているファイル(校正担当のチェックを通過済み=あなたの最終承認待ち)を
            すべて洗い出す:
            - instagram_tiktok, x_threads, note_ameba, line
            該当ファイルが1件以上あれば、01_HQ/tasks/approval-pending.md を
            (既存があれば上書きで)更新し、ファイルパスの一覧を
            「## <今日の日付YYYY-MM-DD>時点の承認待ち」として記載する
            (このファイルは日々最新の状態に上書きしてよい、履歴を残す必要はない)。
            該当ファイルが0件であれば、01_HQ/tasks/approval-pending.md に
            「現在承認待ちはありません」と記載する。

            ## 制約
            - 1タスクカード=1投稿単位を守ること
            - 優先度(priority)は締切(due)が近いものをhighにすること
            - 部署をまたぐ依頼を作った場合は、依頼先部署にも同じ内容のタスクカードを
              複製し、related_task_idで元タスクを参照する

            ## 完了後の処理
            何かファイルを作成・更新した場合のみ、以下のコマンドでコミット・プッシュしてください:
            git config user.name "gakugym-ai-bot"
            git config user.email "bot@example.com"
            git add 01_HQ/tasks/
            git commit -m "hq_secretary daily tasks $(date +%F)"
            git push
