name: passnavi-probe

# 2026-11-03追加: 「大学 学部別倍率ランキング」リール(②総合型選抜アカウント)の
# データ源であるパスナビに GitHub Actions から接続できるか、ページ構造・年度表記・
# 利用規約を確認するための調査用ワークフロー(手動実行のみ)。
# 取得したページはリポジトリにコミットせず、ログに要点だけを出す。

on:
  workflow_dispatch:
    inputs:
      url:
        description: '調べるURL'
        required: true
        default: 'https://passnavi.obunsha.co.jp/'
      grep:
        description: 'ログに出す行を絞る正規表現(空なら本文テキストの先頭を出す)'
        required: false
        default: ''

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch
        env:
          URL: ${{ github.event.inputs.url }}
          GREP: ${{ github.event.inputs.grep }}
        run: |
          curl -sSL -A "Mozilla/5.0 (compatible; gakugym-research/1.0)" -o page.html -w "status=%{http_code} final=%{url_effective}\n" "$URL" || true
          ls -l page.html || exit 0
          python3 - <<'PY'
          import re, html, os
          raw = open("page.html", encoding="utf-8", errors="replace").read()
          links = sorted(set(re.findall(r'href="([^"]+)"', raw)))
          print("=== title:", re.search(r"<title>(.*?)</title>", raw, re.S).group(1).strip() if "<title>" in raw else "-")
          print("=== links (%d) ===" % len(links))
          for l in links[:400]: print(l)
          txt = re.sub(r"<script.*?</script>|<style.*?</style>", " ", raw, flags=re.S)
          txt = html.unescape(re.sub(r"<[^>]+>", "\n", txt))
          lines = [l.strip() for l in txt.splitlines() if l.strip()]
          g = os.environ.get("GREP", "")
          print("=== text ===")
          sel = [l for l in lines if re.search(g, l)] if g else lines[:400]
          for l in sel[:600]: print(l)
          PY
