name: line-select-draft

on:
  schedule:
    - cron: '0 21 * * 1,4'   # 毎週月・木 06:00 JST
  workflow_dispatch: {}

permissions:
  contents: write
  id-token: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select and prepare LINE draft
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --allowedTools "Write,Edit,Bash(git *)"
          prompt: |
            あなたは「学ジム」のLINE公式担当AIです。
            以下のファイルを読み、そこに書かれたルールに厳密に従ってください:
            - 02_departments/line/department.md
            - 03_assets/brand-guide.md

            02_departments/x_threads/published/ フォルダの中から、
            frontmatterに line_sent: true が付いていないファイルを
            日付が古い順に1件選んでください
            (3つの型が直近偏らないよう配慮してください)。

            選んだ投稿の本文からハッシュタグを全て削除したものを、
            02_departments/line/drafts/task-<今日の日付YYYY-MM-DD>-line-001.md
            という名前で保存してください(frontmatter込み)。

            選定元のファイルには line_sent: true と
            line_sent_date: <今日の日付> を追記してください。

            最後に、以下のコマンドで変更をコミット・プッシュしてください:
            git config user.name "gakugym-ai-bot"
            git config user.email "bot@example.com"
            git add 02_departments/line/drafts/ 02_departments/x_threads/published/
            git commit -m "line draft selection $(date +%F)"
            git push
