name: countdown-story-image

# ③(習慣化メソッド発信アカウント、構想中)のストーリーズ用、「共通テストまで
# あと〇日」カウントダウン画像を毎日自動生成してmainにコミットする。
# 2026-10-27追加。詳細: 01_HQ/roadmap.md参照。
#
# ストーリーズへの投稿自体はInstagram Graph APIのStories自動投稿が未整備のため、
# 画像生成までを自動化し、投稿は益田さんが毎日手動で行う。

on:
  schedule:
    - cron: '0 20 * * *'   # 毎日05:00 JST
    # 2026-11-03追加: GitHub Actionsの定時実行が混雑で大幅に遅れる/飛ばされることがあり、
    # 11/3分が昼になっても生成されなかったため予備の時刻を追加(生成済みの日はスキップされる)
    - cron: '0 0 * * *'    # 予備: 毎日09:00 JST
    - cron: '0 3 * * *'    # 予備: 毎日12:00 JST
  workflow_dispatch: {}

env:
  TZ: Asia/Tokyo

permissions:
  contents: write

concurrency:
  group: countdown-story-image
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      # 2026-11-03: 2種類のデザインを毎日作る(益田さんの指示)
      # - daily/         … 中央に歌詞スタンプ用の空きがあるデザイン(音源付きで手動投稿する時用)
      # - daily_classic/ … 中央を空けない従来デザイン(音源なし=予約投稿用)
      # 先行制作済みの日付はファイルがあるのでスキップされる
      - name: Decide output paths
        id: target
        run: |
          D=$(date +%F)
          echo "date=$D" >> "$GITHUB_OUTPUT"
          TODO=""
          for STYLE in lyrics classic; do
            if [ "$STYLE" = lyrics ]; then DIR=daily; else DIR=daily_classic; fi
            OUT="02_departments/creative/countdown/$DIR/countdown-${D}.png"
            if [ -f "$OUT" ]; then echo "$OUT は生成済みのためスキップ"; else TODO="$TODO $STYLE:$OUT"; fi
          done
          echo "todo=$TODO" >> "$GITHUB_OUTPUT"
          if [ -z "$TODO" ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; else echo "skip=false" >> "$GITHUB_OUTPUT"; fi

      - name: Install dependencies
        if: steps.target.outputs.skip != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-ipafont-gothic fonts-ipafont-mincho
          python3 -m pip install -q pillow

      - name: Generate countdown images
        if: steps.target.outputs.skip != 'true'
        env:
          REEL_FONT: /usr/share/fonts/opentype/ipafont-gothic/ipag.ttf
          REEL_MINCHO_FONT: /usr/share/fonts/opentype/ipafont-mincho/ipam.ttf
        run: |
          for ITEM in ${{ steps.target.outputs.todo }}; do
            STYLE="${ITEM%%:*}"; OUT="${ITEM#*:}"
            COUNTDOWN_STYLE="$STYLE" python3 02_departments/creative/countdown/render_countdown.py "$OUT"
            SIZE=$(stat -c %s "$OUT"); echo "$OUT size=$SIZE"
            [ "$SIZE" -gt 20000 ] || { echo "画像サイズが異常に小さい"; exit 1; }
          done

      - name: Commit and push
        if: steps.target.outputs.skip != 'true'
        run: |
          git config user.name "gakugym-ai-bot"
          git config user.email "bot@example.com"
          git add 02_departments/creative/countdown/daily/ 02_departments/creative/countdown/daily_classic/
          git commit -m "countdown story image ${{ steps.target.outputs.date }}"
          git pull --rebase origin main
          git push origin main
