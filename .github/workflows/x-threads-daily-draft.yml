name: x-threads-daily-draft

on:
  schedule:
    - cron: '0 21 * * *'   # 毎日 06:00 JST
  workflow_dispatch: {}

env:
  TZ: Asia/Tokyo   # 日本時間で日付を扱うため(UTCのままだとJST朝のcronで日付が1日ずれる不具合があった)

permissions:
  contents: write
  id-token: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate X/Threads quiz draft
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --allowedTools "Read,Write,Bash(git *)"
          prompt: |
            あなたは「学ジム」のX/Threads担当AIです。
            以下のファイルを読み、そこに書かれたルールに厳密に従ってください:
            - 02_departments/x_threads/department.md
            - 03_assets/brand-guide.md
            - 02_departments/x_threads/drafts/ 内の直近のdraft(級が偏らないよう確認)

            department.mdの「今日の1問」節に従い、英検クイズ問題を1問作成してください。
            特に以下を必ず守ること:
            1. 対象級は「準2級・準2級プラス・2級・準1級」の4段階のみ。それ以外の級は
               扱わない。直近のdraftを確認し、同じ級が連続しないようにランダムに選ぶこと。
            2. 文法・語彙いずれかで、選んだ級相当の英文問題(空欄補充形式を推奨)を作成し、
               4択の選択肢(正解1つ+紛らわしい誤答3つ)を用意すること。
            3. **正解が誰が見ても一意に定まる、事実として正しい問題にすること**。
               選択肢・正解を決めた後、必ず自分で検算し、誤りがないか確認してから
               確定すること(英語として誤った知識を発信しないため、最重要事項)。
            4. (2026-10-12更新、重要)投稿用キャプションを作成すること。リール動画の
               エンド画面が「答え&解説は概要欄へ!」と案内する仕様になったため、
               **正解・解説は投稿後にコメントで別途出すのではなく、投稿時のキャプション
               (概要欄)に最初から書くこと**。キャプションの構成:
               a) フック文(1〜2行。問題文の級・テーマを言い換えた、続きが気になる一文)
               b) 正解発表+簡単な解説(1〜2文。意味・文法ポイントなど)
               c) 次回への軽い誘導(例:「また明日チャレンジしてね」)+保存/フォロー訴求
               d) ハッシュタグ(**最大5個**。Instagram/TikTokの「ハッシュタグ」節と同じ
                  上限ルールに合わせる。英検・級・受験英語などから最適な5個を選ぶこと)
            5. (2026-10-17追加、重要)動画生成スクリプト(`make_reel_from_draft.py`)は
               「## 選択肢」の①②③④を内部でA/B/C/Dに変換して動画に表示する
               (①→A, ②→B, ③→C, ④→D)。そのため、**「## 正解」とキャプション内で
               正解を示す箇所は、動画の画面に実際に表示される文字(A〜D)で書くこと**
               (「## 選択肢」セクション自体は従来通り①〜④のまま書いてよい。変換が
               必要なのは「正解はどれか」を文章で言及する箇所だけ)。2026-10-15・16に
               ①〜④表記のまま書いてしまい、動画の表記(A〜D)と食い違う、と校正担当から
               2日連続で指摘を受けたため追加したルール。

            作成したファイルは
            02_departments/x_threads/drafts/task-<今日の日付YYYY-MM-DD>-quiz-001.md
            という名前で、以下のフォーマットで保存してください:

            ---
            department: x_threads
            role: X/Threads担当
            date: <今日の日付>
            status: draft
            type: 今日の1問(英検)
            level: <準2級|準2級プラス|2級|準1級>
            approved_by:
            ---

            ## 問題
            (英文。空欄は ______ で示す)

            ## 選択肢
            ① 〜
            ② 〜
            ③ 〜
            ④ 〜

            ## 正解
            (動画に実際に表示されるA〜Dの文字で書くこと。①→A, ②→B, ③→C, ④→Dの
            対応表で変換する。例: 選択肢③が正解なら「C(単語・意味)」と書く)

            ## 検算メモ
            (なぜこれが正解で、他の3つが誤りなのかを簡潔に説明。この問題の妥当性を
            自分で確認した根拠を書くこと。①〜④表記のままでよい)

            ## 投稿用キャプション(X/Threads共通、概要欄にそのまま貼る)
            ```
            (フック文 → 正解発表(「正解はA」のようにA〜Dの文字で)+簡単な解説 →
            次回への軽い誘導/保存・フォロー訴求 → ハッシュタグ最大5個、の順で
            1つの文章にまとめる)
            ```

            ## リール動画
            (eiken-quiz-reel.ymlが動画を生成した後、ここにファイルパスを記録する。
            このワークフローでは空欄のままでよい。2026-10-17更新: 見出し名を
            「Canvaデザイン」から実態に合わせて変更した。動画生成は2026-10-12以降
            Canvaを使わずスクリプトで行っている。なお生成された動画に文字化けが
            ないか(問題文・選択肢・カウントダウン・「答えをコメント欄へ!」
            「答え&解説は概要欄へ!」)は、この下書き生成の時点では確認できないため、
            日次レビューRoutineまたは投稿前に益田さんが目視確認すること)

            (2026-10-12更新: statusは"draft"で保存すること。以前"review"で保存していたが、
            それだと校正担当の日次チェック(対象はstatus:draftのみ)がこのファイルを
            一切チェックしない不具合があったため修正した)

            最後に、以下のコマンドで変更をコミット・プッシュしてください:
            git config user.name "gakugym-ai-bot"
            git config user.email "bot@example.com"
            git add 02_departments/x_threads/drafts/
            git commit -m "x/threads daily quiz draft $(date +%F)"
            git push
