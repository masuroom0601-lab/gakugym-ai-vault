name: creative-pipeline

# 2026-09-12: このPlaywright方式は廃止。フィードもリールと同様に
# claude.aiのRoutine経由でCanvaデザインを複製・編集する方式に統一した
# (通常版: DAHU-f_gDOU、図解で覚えるシリーズ: DAHCqMT3jhw)。
# 日次cronは無効化済み。ファイルは参考記録として残す。
# 詳細: 02_departments/creative/department.md の「廃止した方式」節
on:
  # schedule: 無効化済み(旧: '5 21 * * *' = 毎日06:05 JST)
  workflow_dispatch: {}

permissions:
  contents: write
  id-token: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract feed spec from today's Instagram/TikTok draft
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true
          claude_args: |
            --allowedTools "Read,Write"
          prompt: |
            あなたは「学ジム」のクリエイティブ制作担当AIです。
            02_departments/creative/department.md の「技術方式(最重要ルール)」に
            厳密に従ってください。**あなたはHTML/CSSテンプレートを一切書き換えません**。
            あなたの仕事は、Instagram/TikTok担当が作った台本のうち**フィード
            (カルーセル)部分だけ**を、tools/creative/README.md に記載された
            JSONスキーマに変換することです(リールのサムネ・本編はCanva経由の
            別の仕組みで生成されるため、ここでは扱いません)。

            1. 本日の日付(YYYY-MM-DD)に対応する
               02_departments/instagram_tiktok/drafts/task-<今日の日付>-ig-*.md
               を探す。存在しない場合は何もせず終了する。
            2. 既に同名の 02_departments/creative/drafts/<task_id>.spec.json が
               存在する場合はスキップする(重複生成防止)。
            3. 見つかった場合、tools/creative/README.md の「spec.json のスキーマ」
               セクション(特に「テンプレート固有のフィールド」)に厳密に従い、
               「## フィード下書き(カルーセル)」セクションから以下を抽出してJSONを作成する:
               - task_id: ファイル名から日付+連番を取り出す(例: 2026-09-11-ig-001)
               - feed.template: 使用テンプレート(A=和紙×手書き/B=グラデーション/
                 C=紺×白アイコン。「テンプレA」等の記載から判定)
               - feed.slides: 表紙(role: cover)/中面各枚(role: content)/
                 締め(role: closing)の配列。台本の内容に応じて、
                 テンプレートB(cover用のnumber/category)、
                 テンプレートC(cover用のgrid配列)、
                 テンプレートA(bodyの中で強調したいフレーズをhighlightsに)
                 も適切に埋めること(該当しない場合は省略してよい)
            4. 作成したJSONを
               02_departments/creative/drafts/<task_id>.spec.json
               として保存する(thumbnailフィールドは含めない)。
            5. 台本の情報が不十分でJSON化できない項目があれば、
               JSON内に `"_notes": "..."` フィールドを追加し、
               何が不足しているかを日本語で明記する。
            6. git操作は行わない(後続のステップでまとめてコミットする)。

      - name: Install Japanese fonts (avoid garbled text if web fonts are unavailable)
        run: sudo apt-get update -y && sudo apt-get install -y fonts-noto-cjk

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install renderer dependencies
        working-directory: tools/creative
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Render thumbnails and feed slides
        working-directory: tools/creative
        run: |
          shopt -s nullglob
          for spec in ../../02_departments/creative/drafts/*.spec.json; do
            task_id=$(basename "$spec" .spec.json)
            outdir="../../02_departments/creative/drafts/generated/${task_id}"
            echo "Rendering ${task_id}..."
            node render.js "$spec" "$outdir"
          done

      - name: Commit and push generated assets
        run: |
          git config user.name "gakugym-ai-bot"
          git config user.email "bot@example.com"
          git add 02_departments/creative/drafts/
          if ! git diff --cached --quiet; then
            git commit -m "creative pipeline render $(date +%F)"
            git push
          else
            echo "No changes to commit."
          fi
