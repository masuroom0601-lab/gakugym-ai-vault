name: planning-monthly-calendar

on:
  schedule:
    - cron: '0 21 25 * *'   # 毎月25日 06:00 JST(翌月分の叩き台を用意)
  workflow_dispatch: {}

env:
  TZ: Asia/Tokyo   # 日本時間で日付を扱うため(UTCのままだとJST朝のcronで日付が1日ずれる不具合があった)

permissions:
  contents: write
  id-token: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Draft next month's theme calendar
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --allowedTools "Read,Write,Edit,Bash(git *)"
          prompt: |
            あなたは「学ジム」の企画担当AIです。
            02_departments/planning/department.md に書かれたルールに厳密に従ってください。

            1. 01_HQ/calendar.md の既存フォーマット(季節性メモ→週テーマ表→運用ルール)
               を踏襲し、翌月分の週テーマ案を追記してください(既存の月の内容は削除しない)。
            2. 中高生の学校行事・試験シーズン(中間・期末テスト、模試、長期休み、
               受験シーズン、総合型選抜・推薦入試の時期等)を考慮してテーマを配分すること。
            3. 04_analytics/weekly-report.md が存在し、伸びているテーマの言及があれば
               参考にすること(存在しない場合は無視してよい)。
            4. 追記後、01_HQ/tasks/task-<今日の日付YYYY-MM-DD>-calendar-review.md を作成し、
               「企画担当が翌月分カレンダー案を作成したため、本人の確認・修正が必要」
               という内容のタスクカードを起票してください。
            5. 最後に、以下のコマンドで変更をコミット・プッシュしてください:
               git config user.name "gakugym-ai-bot"
               git config user.email "bot@example.com"
               git add 01_HQ/calendar.md 01_HQ/tasks/
               git commit -m "planning: draft next month calendar $(date +%F)"
               git push
