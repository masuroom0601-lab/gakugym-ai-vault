# note/Ameba 見出し画像用 写真カタログ(2026-10-17新設)
#
# tools/note_ameba/select.js が投稿のたびに、記事内容に合う写真をこの一覧から選び、
# header-image.js が「写真+記事タイトル」の見出し画像(1280x670)を自動生成します。
# 写真が選ばれた場合は、既存のnote記事に合わせて「写真のみ・文字なし」の見出し画像になります。
# 一覧が空、または記事に合う写真が無い場合は、明るいベージュ地+タイトル文字で
# 生成するため、写真を用意しなくても投稿は止まりません。
#
# 【写真の選び方の目安】益田さんの既存note記事の見出し画像(reference/ フォルダ、2026-10-17取得)の傾向:
#   - 文字は入っていない(写真・イラストのみ)
#   - 明るい自然光・暖色系(窓からの光、白〜ベージュ、木の机や椅子)
#   - 勉強・面談・親子のシーン(机に向かう生徒、教室、保護者と先生の面談、親子の後ろ姿)
#   - 実写とアニメ調イラストの両方を使っている
# reference/ の画像そのものは過去記事で使用済みのため、ここには登録していません
# (同じ画像の使い回しを避けるため。また、noteの「みんなのフォトギャラリー」由来の画像は
#  note以外=Amebaでの利用が認められていない可能性があるため)。
#
# 益田さんへ(写真を追加する手順):
#   1. 著作権フリー・商用利用可の写真をこのフォルダ(03_assets/images/note_ameba/)に置く
#      (横長推奨。1280x670以上。人物の顔が写っていないものが安全です)
#   2. 下の images: に1行ずつ追加し、その写真に合う記事のキーワードを書く
#   例:
#   - file: 03_assets/images/note_ameba/parent-child-desk.jpg
#     keywords: [声かけ, 子育て, 親子, 宿題]
#
# 特定の記事だけ画像を固定したいときは、下書きのfrontmatterに
#   header_image: 03_assets/images/note_ameba/xxx.png
# と書けば、その画像がそのまま(加工なしで)使われます。

images: []
