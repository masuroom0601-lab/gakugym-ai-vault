<!doctype html>
<!--
  学ジム note/Ameba 見出し画像 固定テンプレート(2026-10-17新設、1280x670)
  tools/note_ameba/header-image.js がPlaywrightでPNG化する。AIはCSSを書き換えない。
  パラメータは ?d=<base64(UTF-8 JSON)> で受け取る。
  JSON: { title, subtitle, subject, bg }
  - title:    メインの見出し(記事タイトルの「―」より前)
  - subtitle: 補足(記事タイトルの「―」より後。省略可)
  - subject:  科目・テーマ。含まれる単語でアクセント色を決める(brand-guide準拠)
  - bg:       背景写真のパス(省略時は明るいベージュの背景+タイトル文字)

  2026-10-17改訂: 益田さんの既存note記事の見出し画像(03_assets/images/note_ameba/reference/)に合わせ、
    - 写真がある場合は「写真のみ・文字なし」(既存記事はすべて文字なしの写真/イラスト。
      noteはタイトルが画像の下に表示されるため、画像に文字は入れない)
    - 写真が無い場合のみ、明るい自然光・暖色系(白〜ベージュ・木目の茶)の背景にタイトルを置く
    (旧デザインの紺背景×白文字は既存記事の明るい雰囲気と合わないため廃止)
-->
<html lang="ja">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@700;900&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1280px;height:670px;overflow:hidden;
    font-family:"Noto Sans JP","Noto Sans CJK JP","IPAGothic",sans-serif;}
  #bg{position:absolute;inset:0;background-size:cover;background-position:center;}
  /* 写真が無い時: 窓から差す自然光のような、白〜ベージュの柔らかいグラデーション */
  #bg.placeholder{background:
    radial-gradient(ellipse at 85% 10%, rgba(255,250,235,1) 0%, rgba(255,250,235,0) 55%),
    linear-gradient(135deg,#fbf6ec 0%,#f3e7d3 60%,#e9d6b8 100%);}
  #bar{position:absolute;left:0;right:0;bottom:0;height:14px;}
  #content{position:absolute;left:110px;right:110px;top:0;bottom:0;
    display:flex;flex-direction:column;justify-content:center;color:#4a3626;}
  #tag{display:inline-block;align-self:flex-start;font-size:28px;font-weight:700;
    padding:6px 22px;border-radius:999px;color:#fff;margin-bottom:30px;}
  #title{font-size:68px;font-weight:900;line-height:1.35;letter-spacing:.02em;
    word-break:normal;overflow-wrap:anywhere;}
  #subtitle{font-size:32px;font-weight:700;line-height:1.55;margin-top:24px;color:#7a5f48;}
  #brand{position:absolute;right:60px;bottom:40px;color:#9b7b5e;font-size:28px;font-weight:900;letter-spacing:.08em;}
  body.photo-only #bar, body.photo-only #content, body.photo-only #brand{display:none;}
</style>
</head>
<body>
  <div id="bg"></div>
  <div id="bar"></div>
  <div id="content">
    <div id="tag"></div>
    <div id="title"></div>
    <div id="subtitle"></div>
  </div>
  <div id="brand">学ジム</div>
<script>
  // 科目別配色(brand-guide.md「科目別サムネ配色」と同じ対応表)
  const SUBJECT_COLORS = [
    ["英語", "#FFD84D"], ["古典", "#FF5FA8"], ["古文", "#FF5FA8"], ["漢文", "#FF5FA8"],
    ["日本史", "#2E9E63"], ["総合型", "#4EA1FF"],
  ];
  function colorFor(label){
    if (!label) return "#FF8A3D";
    for (const [key, color] of SUBJECT_COLORS) if (label.includes(key)) return color;
    return "#FF8A3D";
  }
  function b64ToUtf8(b64){
    const binary = atob(b64);
    const bytes = new Uint8Array(binary.length);
    for (let i=0;i<binary.length;i++) bytes[i]=binary.charCodeAt(i);
    return new TextDecoder("utf-8").decode(bytes);
  }
  async function init(){
    const raw = new URLSearchParams(location.search).get("d");
    const data = raw ? JSON.parse(b64ToUtf8(decodeURIComponent(raw))) : {};
    const color = colorFor(data.subject);

    const bg = document.getElementById("bg");
    if (data.bg) { bg.style.backgroundImage = `url("${data.bg}")`; document.body.classList.add("photo-only"); }
    else bg.classList.add("placeholder");
    document.getElementById("bar").style.background = color;

    const tag = document.getElementById("tag");
    if (data.tagLabel) { tag.textContent = data.tagLabel; tag.style.background = color; }
    else tag.style.display = "none";

    const title = document.getElementById("title");
    title.textContent = data.title || "";
    const sub = document.getElementById("subtitle");
    if (data.subtitle) sub.textContent = data.subtitle; else sub.style.display = "none";

    if (document.fonts && document.fonts.ready) { try { await document.fonts.ready; } catch(e){} }
    // 長いタイトルは枠に収まるまで文字を小さくする(最小44px)
    const content = document.getElementById("content");
    let size = 72;
    while (content.scrollHeight > 670 - 60 && size > 44) { size -= 4; title.style.fontSize = size + "px"; }
    let subSize = 34;
    while (content.scrollHeight > 670 - 60 && subSize > 24) { subSize -= 2; sub.style.fontSize = subSize + "px"; }
    document.body.dataset.ready = "true";
  }
  init();
</script>
</body>
</html>
