<!doctype html>
<!--
  学ジム フィード テンプレートA(和紙×手書き風)固定テンプレート
  体験談・ノウハウ系のテーマに使用。CSSは以後書き換えない。
  ?d=<base64(UTF-8 JSON)>  JSON: { role, title, catch, body, checklist }
  role: "cover" | "content" | "closing"
-->
<html lang="ja">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@600&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1080px;height:1350px;overflow:hidden;
    font-family:"Klee One","Noto Sans JP","Noto Sans CJK JP",sans-serif;
    background:repeating-linear-gradient(135deg,#f6efe0 0px,#f6efe0 2px,#f1e8d5 2px,#f1e8d5 4px);
    color:#4a3826;}
  #frame{position:absolute;inset:36px;border:3px solid #c9a973;}
  #wrap{position:absolute;inset:0;padding:110px 100px;display:flex;flex-direction:column;justify-content:center;}
  #icon{font-size:48px;margin-bottom:24px;color:#a8763f;}
  #title{font-size:60px;font-weight:600;line-height:1.5;white-space:pre-wrap;margin-bottom:30px;}
  #catch{font-size:34px;font-weight:400;color:#8a6a3e;white-space:pre-wrap;font-family:"Noto Sans JP",sans-serif;}
  #body{font-size:36px;font-weight:400;line-height:1.75;white-space:pre-wrap;
    color:#5a4230;font-family:"Noto Sans JP",sans-serif;}
  #mark{position:absolute;bottom:64px;right:96px;font-size:26px;color:#a8763f;font-weight:700;}
</style>
</head>
<body>
  <div id="frame"></div>
  <div id="wrap">
    <div id="icon"></div>
    <div id="title"></div>
    <div id="body"></div>
    <div id="catch"></div>
  </div>
  <div id="mark">学ジム</div>
<script>
  function b64ToUtf8(b64){
    const binary = atob(b64);
    const bytes = new Uint8Array(binary.length);
    for (let i=0;i<binary.length;i++) bytes[i]=binary.charCodeAt(i);
    return new TextDecoder("utf-8").decode(bytes);
  }
  async function init(){
    const qp = new URLSearchParams(location.search);
    const raw = qp.get("d");
    const data = raw ? JSON.parse(b64ToUtf8(decodeURIComponent(raw))) : {};
    document.getElementById("title").textContent = data.title || "";
    document.getElementById("body").textContent = data.role === "cover" ? "" : (data.body || "");
    document.getElementById("catch").textContent = data.role === "cover" ? (data.catch || "") : "";
    document.getElementById("icon").textContent = data.checklist ? "□" : "";
    if (document.fonts && document.fonts.ready) await document.fonts.ready;
    document.body.setAttribute("data-ready", "true");
  }
  init();
</script>
</body>
</html>
