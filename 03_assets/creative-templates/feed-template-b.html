<!doctype html>
<!--
  学ジム フィード テンプレートB(カラーグラデーションカード)固定テンプレート
  教科横断の比較・ランキング・時間割など向け。CSSは以後書き換えない。
  ?d=<base64(UTF-8 JSON)>  JSON:
  { role, title, category, number, icon, catch, body, checklist,
    page_number, total_pages }
  role: "cover" | "content" | "closing"
  number: coverのみ。大きく出す数字(例: "5")。無ければ非表示
  category: coverのみ。数字の右に出す小さいピル文言(例: "教科別" "タイミング")
-->
<html lang="ja">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1080px;height:1350px;overflow:hidden;
    font-family:"Noto Sans JP","Noto Sans CJK JP",sans-serif;color:#fff;
    background:linear-gradient(135deg,#ff3d81 0%,#a855f7 55%,#ff8a3d 100%);}
  #wrap{position:absolute;inset:0;padding:78px 72px;display:flex;flex-direction:column;}

  #badge-row{display:flex;align-items:center;gap:20px;margin-bottom:8px;}
  #clock{width:84px;height:84px;border-radius:50%;background:rgba(255,255,255,.22);
    display:flex;align-items:center;justify-content:center;font-size:42px;}
  #number{font-size:150px;font-weight:900;line-height:1;
    -webkit-text-stroke:3px rgba(255,255,255,.5);}
  #category{margin-left:auto;background:rgba(255,255,255,.9);color:#7a2f8f;
    font-weight:700;font-size:30px;padding:12px 28px;border-radius:999px;white-space:nowrap;}

  #title{font-size:76px;font-weight:900;line-height:1.35;white-space:pre-wrap;
    margin:24px 0 40px;text-shadow:0 6px 18px rgba(0,0,0,.18);}
  .role-content #title,.role-closing #title{font-size:58px;margin-top:0;}

  #card{margin-top:auto;background:#fff;color:#3a2145;border-radius:24px;
    padding:36px 40px;display:flex;align-items:flex-start;gap:20px;
    box-shadow:0 20px 40px rgba(0,0,0,.2);}
  #card .pencil{font-size:44px;flex:none;}
  #card .catch-text{font-size:34px;line-height:1.6;font-weight:700;white-space:pre-wrap;}
  .role-content #card,.role-closing #card{display:none;}

  #icon{font-size:56px;margin-bottom:16px;}
  #body{font-size:40px;font-weight:400;line-height:1.65;white-space:pre-wrap;}

  #mark{position:absolute;bottom:52px;right:72px;font-size:28px;color:rgba(255,255,255,.85);font-weight:700;}
  #pagenum{position:absolute;bottom:48px;left:72px;font-size:30px;font-weight:700;color:rgba(255,255,255,.85);}
  [hidden]{display:none !important;}
</style>
</head>
<body>
  <div id="wrap">
    <div id="badge-row" hidden>
      <div id="clock">🕐</div>
      <div id="number"></div>
      <div id="category"></div>
    </div>
    <div id="title"></div>
    <div id="icon"></div>
    <div id="body"></div>
    <div id="card" hidden>
      <div class="pencil">✏️</div>
      <div class="catch-text"></div>
    </div>
  </div>
  <div id="mark">学ジム</div>
  <div id="pagenum"></div>
<script>
  function b64ToUtf8(b64){
    const binary = atob(b64);
    const bytes = new Uint8Array(binary.length);
    for (let i=0;i<binary.length;i++) bytes[i]=binary.charCodeAt(i);
    return new TextDecoder("utf-8").decode(bytes);
  }
  async function init(){
    const qp = new URLSearchParams(location.search);
    const raw = qp.get("d");
    const data = raw ? JSON.parse(b64ToUtf8(decodeURIComponent(raw))) : {};
    const role = data.role || "content";
    document.body.classList.add("role-" + role);

    document.getElementById("title").textContent = data.title || "";

    if (role === "cover" && data.number) {
      document.getElementById("badge-row").hidden = false;
      document.getElementById("number").textContent = data.number;
      document.getElementById("category").textContent = data.category || "";
    }

    if (role === "cover" && data.catch) {
      document.getElementById("card").hidden = false;
      document.querySelector("#card .catch-text").textContent = data.catch;
    } else {
      document.getElementById("icon").textContent = data.icon || (data.checklist ? "✅" : "");
      document.getElementById("body").textContent = data.body || "";
    }

    if (data.page_number && data.total_pages) {
      document.getElementById("pagenum").textContent = `${data.page_number}/${data.total_pages}`;
    }

    if (document.fonts && document.fonts.ready) await document.fonts.ready;
    document.body.setAttribute("data-ready", "true");
  }
  init();
</script>
</body>
</html>
