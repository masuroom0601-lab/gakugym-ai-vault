<!doctype html>
<!--
  学ジム フィード テンプレートB(カラーグラデーションカード)固定テンプレート
  教科横断の比較・スケジュール表など向け。CSSは以後書き換えない。
  ?d=<base64(UTF-8 JSON)>  JSON: { role, title, catch, body, checklist }
  role: "cover" | "content" | "closing"(roleごとに背景グラデーションが変わる)
-->
<html lang="ja">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1080px;height:1350px;overflow:hidden;
    font-family:"Noto Sans JP","Noto Sans CJK JP",sans-serif;}
  #bg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:70px;}
  #bg.role-cover{background:linear-gradient(135deg,#7b5cf0,#4f6df5);}
  #bg.role-content{background:linear-gradient(135deg,#2fb673,#1f8f57);}
  #bg.role-closing{background:linear-gradient(135deg,#ff8a3d,#ff5f5f);}
  #card{width:100%;height:100%;background:#fff;border-radius:36px;
    box-shadow:0 24px 60px rgba(0,0,0,.25);padding:90px 80px;
    display:flex;flex-direction:column;justify-content:center;color:#222;}
  #icon{font-size:48px;margin-bottom:20px;}
  #title{font-size:58px;font-weight:900;line-height:1.4;white-space:pre-wrap;margin-bottom:26px;}
  #catch{font-size:34px;font-weight:400;color:#666;white-space:pre-wrap;}
  #body{font-size:36px;font-weight:400;line-height:1.7;white-space:pre-wrap;color:#333;}
  #mark{position:absolute;bottom:22px;right:28px;font-size:24px;color:rgba(255,255,255,.85);font-weight:700;}
</style>
</head>
<body>
  <div id="bg">
    <div id="card">
      <div id="icon"></div>
      <div id="title"></div>
      <div id="body"></div>
      <div id="catch"></div>
    </div>
  </div>
  <div id="mark">学ジム</div>
<script>
  function b64ToUtf8(b64){
    const binary = atob(b64);
    const bytes = new Uint8Array(binary.length);
    for (let i=0;i<binary.length;i++) bytes[i]=binary.charCodeAt(i);
    return new TextDecoder("utf-8").decode(bytes);
  }
  async function init(){
    const qp = new URLSearchParams(location.search);
    const raw = qp.get("d");
    const data = raw ? JSON.parse(b64ToUtf8(decodeURIComponent(raw))) : {};
    const role = data.role || "content";
    document.getElementById("bg").classList.add("role-" + role);
    document.getElementById("title").textContent = data.title || "";
    document.getElementById("body").textContent = role === "cover" ? "" : (data.body || "");
    document.getElementById("catch").textContent = role === "cover" ? (data.catch || "") : "";
    document.getElementById("icon").textContent = data.checklist ? "✅" : "";
    if (document.fonts && document.fonts.ready) await document.fonts.ready;
    document.body.setAttribute("data-ready", "true");
  }
  init();
</script>
</body>
</html>
